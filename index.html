<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE NIGHT THAT WON'T END</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            overflow: hidden;
            height: 100vh;
            perspective: 1000px;
        }

        /* 3D Scene Container */
        #scene-3d {
            position: relative;
            width: 100vw;
            height: 100vh;
            transform-style: preserve-3d;
            perspective: 800px;
            background: linear-gradient(to bottom, #0a0015 0%, #1a0030 50%, #2a1040 100%);
        }

        /* Animated Street Ground */
        .street {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to bottom,
                rgba(20, 0, 40, 0.8) 0%,
                rgba(10, 0, 20, 0.95) 100%);
            transform: rotateX(75deg) translateZ(-300px);
            transform-origin: bottom;
            overflow: hidden;
        }

        /* Street Lines */
        .street-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 80px,
                rgba(0, 255, 255, 0.3) 80px,
                rgba(0, 255, 255, 0.3) 85px
            );
            animation: street-move 3s linear infinite;
        }

        @keyframes street-move {
            from { transform: translateY(0); }
            to { transform: translateY(85px); }
        }

        /* Buildings */
        .building {
            position: absolute;
            bottom: 40%;
            background: rgba(10, 0, 30, 0.9);
            border: 1px solid rgba(0, 255, 255, 0.3);
            transform-style: preserve-3d;
        }

        .building-1 {
            left: 5%;
            width: 150px;
            height: 400px;
            box-shadow: inset 0 0 50px rgba(255, 0, 255, 0.3),
                        0 0 100px rgba(255, 0, 255, 0.5);
        }

        .building-2 {
            left: 25%;
            width: 120px;
            height: 300px;
            box-shadow: inset 0 0 50px rgba(0, 255, 255, 0.3),
                        0 0 100px rgba(0, 255, 255, 0.5);
        }

        .building-3 {
            right: 5%;
            width: 180px;
            height: 450px;
            box-shadow: inset 0 0 50px rgba(255, 0, 150, 0.3),
                        0 0 100px rgba(255, 0, 150, 0.5);
        }

        .building-4 {
            right: 30%;
            width: 100px;
            height: 250px;
            box-shadow: inset 0 0 50px rgba(0, 150, 255, 0.3),
                        0 0 100px rgba(0, 150, 255, 0.5);
        }

        /* Building Windows */
        .building::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 20px, rgba(0, 255, 255, 0.2) 20px, rgba(0, 255, 255, 0.2) 22px),
                repeating-linear-gradient(90deg, transparent, transparent 15px, rgba(0, 255, 255, 0.2) 15px, rgba(0, 255, 255, 0.2) 17px);
            animation: window-flicker 3s infinite;
        }

        @keyframes window-flicker {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.4; }
        }

        /* Volumetric Rain */
        .rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .rain-drop {
            position: absolute;
            width: 2px;
            height: 80px;
            background: linear-gradient(to bottom,
                transparent,
                rgba(0, 255, 255, 0.6),
                transparent);
            animation: rain-fall linear infinite;
        }

        @keyframes rain-fall {
            from {
                transform: translateY(-100px) translateZ(0);
                opacity: 1;
            }
            to {
                transform: translateY(100vh) translateZ(0);
                opacity: 0.3;
            }
        }

        /* Fog Layer */
        .fog {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: radial-gradient(ellipse at bottom,
                rgba(100, 0, 150, 0.3) 0%,
                transparent 70%);
            animation: fog-drift 20s infinite;
            pointer-events: none;
        }

        @keyframes fog-drift {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(100px); }
        }

        /* Neon Sign Glow */
        .neon-sign {
            position: absolute;
            top: 20%;
            font-size: 4em;
            color: #ff00ff;
            text-shadow:
                0 0 10px #ff00ff,
                0 0 20px #ff00ff,
                0 0 40px #ff00ff,
                0 0 80px #ff00ff;
            animation: neon-flicker 4s infinite;
            font-weight: bold;
            letter-spacing: 10px;
        }

        .neon-sign-1 {
            left: 8%;
            transform: rotate(-2deg);
        }

        .neon-sign-2 {
            right: 8%;
            color: #00ffff;
            text-shadow:
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 40px #00ffff,
                0 0 80px #00ffff;
        }

        @keyframes neon-flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
            }
            20%, 24%, 55% {
                opacity: 0.4;
            }
        }

        /* 3D Interactive Objects Container */
        #interactive-container {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 400px;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .interactive-object-3d {
            position: absolute;
            cursor: pointer;
            transition: transform 0.3s ease;
            transform-style: preserve-3d;
        }

        .interactive-object-3d:hover {
            transform: scale(1.2) translateZ(50px);
            filter: drop-shadow(0 0 40px currentColor);
        }

        /* 3D Person */
        #person-3d {
            left: 15%;
            bottom: 0;
        }

        .person-body {
            width: 100px;
            height: 180px;
            position: relative;
            transform-style: preserve-3d;
            animation: person-glitch 2s infinite;
        }

        @keyframes person-glitch {
            0%, 98%, 100% {
                transform: translateX(0);
            }
            99% {
                transform: translateX(5px);
            }
        }

        .person-head {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #00ffff, #0088ff);
            border-radius: 50%;
            margin: 0 auto 10px;
            box-shadow: 0 0 30px #00ffff, inset 0 0 20px rgba(0, 0, 0, 0.5);
            animation: head-pulse 2s infinite;
        }

        @keyframes head-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .person-torso {
            width: 60px;
            height: 80px;
            background: linear-gradient(135deg, #00ffff, #0066ff);
            margin: 0 auto;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
        }

        .person-legs {
            width: 50px;
            height: 50px;
            background: linear-gradient(180deg, #0066ff, #003366);
            margin: 5px auto;
            border-radius: 5px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .person-label {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ffff;
            font-size: 0.8em;
            white-space: nowrap;
            text-shadow: 0 0 10px #00ffff;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .interactive-object-3d:hover .person-label,
        .interactive-object-3d:hover .can-label,
        .interactive-object-3d:hover .wheel-label {
            opacity: 1;
        }

        /* 3D Spray Can */
        #spray-can-3d {
            right: 20%;
            bottom: 50px;
        }

        .spray-can-body {
            width: 60px;
            height: 120px;
            background: linear-gradient(180deg, #00ffff, #0099ff, #0066ff);
            border-radius: 15px;
            position: relative;
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.7),
                inset -5px 0 10px rgba(0, 0, 0, 0.3),
                inset 5px 0 10px rgba(255, 255, 255, 0.2),
                0 0 30px rgba(0, 255, 255, 0.6);
            transform: rotateX(10deg);
        }

        .spray-cap {
            width: 40px;
            height: 20px;
            background: linear-gradient(180deg, #ff00ff, #cc00cc);
            border-radius: 10px 10px 5px 5px;
            position: absolute;
            top: -15px;
            left: 10px;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
        }

        .spray-particles {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ffff;
            border-radius: 50%;
            animation: spray-particle 1.5s infinite;
            box-shadow: 0 0 10px #00ffff;
        }

        @keyframes spray-particle {
            0% {
                transform: translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), -80px);
                opacity: 0;
            }
        }

        .particle:nth-child(1) { --tx: -10px; animation-delay: 0s; }
        .particle:nth-child(2) { --tx: 0px; animation-delay: 0.2s; }
        .particle:nth-child(3) { --tx: 10px; animation-delay: 0.4s; }
        .particle:nth-child(4) { --tx: -15px; animation-delay: 0.6s; }
        .particle:nth-child(5) { --tx: 15px; animation-delay: 0.8s; }

        .can-label {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ffff;
            font-size: 0.8em;
            white-space: nowrap;
            text-shadow: 0 0 10px #00ffff;
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* 3D Steering Wheel */
        #wheel-3d {
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
        }

        .wheel-outer {
            width: 150px;
            height: 150px;
            border: 12px solid #ff00ff;
            border-radius: 50%;
            position: relative;
            box-shadow:
                0 0 30px rgba(255, 0, 255, 0.8),
                inset 0 0 30px rgba(255, 0, 255, 0.4),
                0 20px 40px rgba(0, 0, 0, 0.7);
            animation: wheel-rotate 4s linear infinite;
            background: radial-gradient(circle, rgba(100, 0, 150, 0.3), transparent);
        }

        @keyframes wheel-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .wheel-spoke {
            position: absolute;
            width: 8px;
            height: 60px;
            background: linear-gradient(180deg, #ff00ff, #cc00ff);
            top: 50%;
            left: 50%;
            transform-origin: center;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
        }

        .wheel-spoke:nth-child(1) { transform: translate(-50%, -50%) rotate(0deg); }
        .wheel-spoke:nth-child(2) { transform: translate(-50%, -50%) rotate(90deg); }
        .wheel-spoke:nth-child(3) { transform: translate(-50%, -50%) rotate(45deg); height: 80px; }
        .wheel-spoke:nth-child(4) { transform: translate(-50%, -50%) rotate(135deg); height: 80px; }

        .wheel-center {
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #00ffff, #0088ff);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px #00ffff;
            animation: center-pulse 1.5s infinite;
        }

        @keyframes center-pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
        }

        .speed-lines {
            position: absolute;
            right: -60px;
            top: 50%;
            transform: translateY(-50%);
        }

        .speed-line {
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, #00ffff, transparent);
            margin: 8px 0;
            animation: speed-line-move 1s infinite;
            box-shadow: 0 0 10px #00ffff;
        }

        .speed-line:nth-child(1) { animation-delay: 0s; }
        .speed-line:nth-child(2) { animation-delay: 0.2s; }
        .speed-line:nth-child(3) { animation-delay: 0.4s; }

        @keyframes speed-line-move {
            0% { transform: translateX(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(30px); opacity: 0; }
        }

        .wheel-label {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff00ff;
            font-size: 0.8em;
            white-space: nowrap;
            text-shadow: 0 0 10px #ff00ff;
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* Description Box */
        .description-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 700px;
            padding: 20px;
            background: rgba(0, 0, 20, 0.85);
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 10px;
            font-size: 1em;
            line-height: 1.6;
            color: #ffffff;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        /* Ending Overlay */
        .ending-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fade-in 1s;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .ending-content {
            width: 80%;
            max-width: 800px;
            padding: 50px;
            background: rgba(10, 0, 30, 0.95);
            border: 3px solid;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 100px currentColor;
        }

        .ending-title {
            font-size: 3em;
            margin-bottom: 30px;
            animation: ending-pulse 2s infinite;
            letter-spacing: 5px;
        }

        @keyframes ending-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .ending-text {
            font-size: 1.3em;
            line-height: 2;
            color: #ffffff;
            margin-bottom: 40px;
        }

        #restart-button {
            padding: 20px 50px;
            background: rgba(255, 0, 100, 0.3);
            border: 3px solid;
            color: #ffffff;
            font-size: 1.2em;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 10px;
            text-shadow: 0 0 10px currentColor;
        }

        #restart-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 50px currentColor;
        }

        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15) 0px,
                transparent 2px,
                transparent 4px,
                rgba(0, 0, 0, 0.15) 6px
            );
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>

    <div id="scene-3d">
        <!-- Rain -->
        <div class="rain-container" id="rain"></div>

        <!-- Buildings -->
        <div class="building building-1"></div>
        <div class="building building-2"></div>
        <div class="building building-3"></div>
        <div class="building building-4"></div>

        <!-- Neon Signs -->
        <div class="neon-sign neon-sign-1">LOOP</div>
        <div class="neon-sign neon-sign-2">NIGHT</div>

        <!-- Street -->
        <div class="street">
            <div class="street-lines"></div>
        </div>

        <!-- Fog -->
        <div class="fog"></div>

        <!-- Interactive Objects -->
        <div id="interactive-container">
            <!-- Person -->
            <div id="person-3d" class="interactive-object-3d" onclick="choiceA()">
                <div class="person-body">
                    <div class="person-head"></div>
                    <div class="person-torso"></div>
                    <div class="person-legs"></div>
                </div>
                <div class="person-label">▸ TALK TO PERSON</div>
            </div>

            <!-- Spray Can -->
            <div id="spray-can-3d" class="interactive-object-3d" onclick="choiceB()">
                <div class="spray-can-body">
                    <div class="spray-cap"></div>
                    <div class="spray-particles">
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                    </div>
                </div>
                <div class="can-label">▸ SPRAY GRAFFITI</div>
            </div>

            <!-- Steering Wheel -->
            <div id="wheel-3d" class="interactive-object-3d" onclick="choiceC()">
                <div class="wheel-outer">
                    <div class="wheel-spoke"></div>
                    <div class="wheel-spoke"></div>
                    <div class="wheel-spoke"></div>
                    <div class="wheel-spoke"></div>
                    <div class="wheel-center"></div>
                </div>
                <div class="speed-lines">
                    <div class="speed-line"></div>
                    <div class="speed-line"></div>
                    <div class="speed-line"></div>
                </div>
                <div class="wheel-label">▸ DRIVE INTO VOID</div>
            </div>
        </div>

        <!-- Description -->
        <div id="description" class="description-box">
            <strong style="color: #00ffff;">THE LOOPING STREET</strong><br>
            Neon rain falls in slow motion. Cars glide through the intersection on a perfect loop. Pedestrians repeat like corrupted holograms. Digital billboards flicker.<br>
            <span style="color: #ff00ff;">You are the only thing in sharp focus.</span>
        </div>
    </div>

    <!-- Ending Overlay -->
    <div id="ending-overlay" class="ending-overlay">
        <div id="ending-content" class="ending-content">
            <div id="ending-title" class="ending-title"></div>
            <div id="ending-text" class="ending-text"></div>
            <button id="restart-button" onclick="restart()">⟲ RESTART</button>
        </div>
    </div>

    <script>
        // Create rain
        const rainContainer = document.getElementById('rain');
        for (let i = 0; i < 100; i++) {
            const drop = document.createElement('div');
            drop.className = 'rain-drop';
            drop.style.left = Math.random() * 100 + '%';
            drop.style.animationDuration = (Math.random() * 0.5 + 0.5) + 's';
            drop.style.animationDelay = Math.random() * 2 + 's';
            rainContainer.appendChild(drop);
        }

        function choiceA() {
            document.getElementById('scene-3d').style.display = 'none';
            const overlay = document.getElementById('ending-overlay');
            const content = document.getElementById('ending-content');
            const title = document.getElementById('ending-title');
            const text = document.getElementById('ending-text');

            overlay.style.display = 'flex';
            content.style.borderColor = '#ff0066';
            content.style.color = '#ff0066';
            title.innerHTML = '⚠ ENDING A: FADE OUT';
            title.style.color = '#ff0066';
            title.style.textShadow = '0 0 30px #ff0066, 0 0 60px #ff0066';
            text.innerHTML = `
                You approach a man who keeps dropping his umbrella.<br><br>
                You say hello. He freezes mid-motion. His eyes blink out of sync, like two video layers trying to align.<br><br>
                Then your arm twitches. Your foot steps backward on its own.<br><br>
                You drop your keys. Pick them up. Drop them. Pick them up.<br><br>
                <span style="color: #ff0066; font-weight: bold; font-size: 1.2em;">Looping. Glitched.</span><br><br>
                <span style="color: #666; font-style: italic;">You join the cycle. Street keeps looping. Nobody knows you ever stopped.</span>
            `;
        }

        function choiceB() {
            document.getElementById('scene-3d').style.display = 'none';
            const overlay = document.getElementById('ending-overlay');
            const content = document.getElementById('ending-content');
            const title = document.getElementById('ending-title');
            const text = document.getElementById('ending-text');

            overlay.style.display = 'flex';
            content.style.borderColor = '#00ff00';
            content.style.color = '#00ff00';
            title.innerHTML = '✓ ENDING B: RETURN CHANGED';
            title.style.color = '#00ff00';
            title.style.textShadow = '0 0 30px #00ff00, 0 0 60px #00ff00';
            text.innerHTML = `
                You paint graffiti on a brick wall — bright electric blue.<br><br>
                The world resets. Pedestrians rewind. Cars jump back to frame one.<br><br>
                But the graffiti stays. It glows.<br><br>
                Reality flickers like a broken game engine. Then—everything snaps back to normal daylight.<br><br>
                <span style="color: #00ff00; font-weight: bold; font-size: 1.2em;">Except the graffiti. Still glowing.</span><br><br>
                <span style="color: #00ffff; font-style: italic;">You escaped the loop, but something in the world has been rewritten.</span>
            `;
        }

        function choiceC() {
            document.getElementById('scene-3d').style.display = 'none';
            const overlay = document.getElementById('ending-overlay');
            const content = document.getElementById('ending-content');
            const title = document.getElementById('ending-title');
            const text = document.getElementById('ending-text');

            overlay.style.display = 'flex';
            content.style.borderColor = '#9900ff';
            content.style.color = '#9900ff';
            title.innerHTML = '∞ ENDING C: DRIVE INTO VOID';
            title.style.color = '#9900ff';
            title.style.textShadow = '0 0 30px #9900ff, 0 0 60px #9900ff';
            text.innerHTML = `
                You get back in your car and accelerate.<br><br>
                Rain becomes neon streaks. Road stretches like an endless ribbon. Buildings dissolve into digital dust.<br><br>
                You pass the city limits and keep going into star-colored darkness.<br><br>
                <span style="color: #9900ff; font-weight: bold; font-size: 1.2em;">NO WORLD LOADED</span><br><br>
                <span style="color: #666; font-style: italic;">You escaped — into infinite, unrendered space.</span>
            `;
        }

        function restart() {
            document.getElementById('scene-3d').style.display = 'block';
            document.getElementById('ending-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
